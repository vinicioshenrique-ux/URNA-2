<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel de Chamada • Eleição Escolar</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#06105f,#153a8b);color:white;font:16px Arial,sans-serif}main{max-width:1400px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff50;padding-bottom:22px}h1{font-size:clamp(28px,4vw,56px);margin:12px 0}h2{font-size:24px}small{color:#ffcf4c;font-weight:bold;letter-spacing:.12em}.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;margin-top:24px}.card{background:#ffffff13;border:1px solid #ffffff38;border-radius:22px;padding:25px}.ticket{display:flex;justify-content:space-between;gap:15px;padding:17px;border-radius:14px;background:#ffffff1b;margin:12px 0;font-size:clamp(18px,2.5vw,34px)}.ticket strong{color:#ffcf4c}.bar{height:13px;background:#ffffff33;border-radius:20px;overflow:hidden;margin:10px 0 22px}.bar i{display:block;height:100%;background:#ffcf4c}.row{display:flex;justify-content:space-between;gap:10px}.chip{display:inline-block;padding:8px 12px;border-radius:30px;background:#ffffff24;margin:5px}.free{background:#178459}.busy{background:#a86c13}.off{background:#656a82}#error{color:#ffdb90}@media(max-width:800px){.layout{grid-template-columns:1fr}main{padding:15px}}</style><link rel="stylesheet" href="/premium-pages.css?v=208"></head><body class="premium-chamada"><main><header><div><small>GRÊMIO ESTUDANTIL</small><h1 id="title">Painel de chamada</h1><div id="school"></div></div><div id="clock"></div></header><div class="layout"><section class="card"><h2>Próximos atendimentos</h2><p>Confira sua senha e dirija-se à urna indicada.</p><div id="tickets">Aguardando chamadas...</div><h2>Urnas</h2><div id="urnas"></div></section><section class="card"><h2>Participação por turma</h2><div id="overall"></div><div id="classes"></div></section></div><p id="error"></p><small>Informações de participação — não exibe votos ou resultados das chapas</small></main><script>const $=x=>document.getElementById(x);function text(el,v){el.textContent=v}async function refresh(){try{const r=await fetch('/api/participation',{cache:'no-store'});if(!r.ok)throw Error('Sem conexão');const d=await r.json();text($('title'),d.settings.election_title||'Painel de chamada');text($('school'),d.settings.school_name||'Eleição Escolar');$('tickets').replaceChildren();d.queue.forEach(q=>{const e=document.createElement('div');e.className='ticket';const n=document.createElement('strong');text(n,q.ticket);const u=document.createElement('span');text(u,q.status==='assigned'?('DIRIJA-SE À '+q.urna):'AGUARDANDO URNA');e.append(n,u);$('tickets').append(e)});if(!d.queue.length)text($('tickets'),'Nenhum atendimento aguardando.');$('urnas').replaceChildren();d.urnas.forEach(u=>{const e=document.createElement('span');e.className='chip '+(u.status==='livre'?'free':u.status==='ocupada'?'busy':'off');text(e,u.name+' • '+u.status);$('urnas').append(e)});$('classes').replaceChildren();let total=0,voted=0;d.classes.forEach(c=>{total+=c.eligible;voted+=c.voted;const row=document.createElement('div');row.className='row';const a=document.createElement('b');text(a,c.class_name||'Sem turma');const b=document.createElement('span');text(b,c.voted+' / '+c.eligible);row.append(a,b);const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('i');fill.style.width=(c.eligible?Math.min(100,c.voted/c.eligible*100):0)+'%';bar.append(fill);$('classes').append(row,bar)});text($('overall'),'Participação geral: '+voted+' de '+total+' eleitores ('+(total?(100*voted/total).toFixed(1):'0')+'%)');text($('error'),'')}catch(e){text($('error'),'Falha ao atualizar. Tentando novamente...')}}function clock(){text($('clock'),new Date().toLocaleTimeString('pt-BR'))}refresh();clock();setInterval(refresh,5000);setInterval(clock,1000)</script></body></html>
