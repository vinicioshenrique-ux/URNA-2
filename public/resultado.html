<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resultado da Eleição • Projeção</title>
<style>
:root{--brand:#163d8f;--gold:#ffca3a;--ink:#172b55}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;color:var(--ink);background:radial-gradient(ellipse at 50% 0%,#3154a6 0,#101f4b 42%,#060d22 100%);overflow-x:hidden}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(14px,3vw,38px);position:relative;overflow:hidden}.glow{position:fixed;width:60vw;height:60vw;max-width:760px;max-height:760px;border-radius:50%;background:#3c74ff22;filter:blur(45px);top:-30vw;left:20vw;pointer-events:none}.card{position:relative;z-index:2;width:min(1200px,100%);max-height:95vh;overflow:auto;padding:clamp(24px,4vw,54px);text-align:center;border:1px solid #ffffff50;border-radius:32px;background:linear-gradient(145deg,#fff 0%,#f4f7ff 65%,#fff9e8 100%);box-shadow:0 35px 120px #0007;animation:appear .8s cubic-bezier(.2,.8,.2,1)}.eyebrow{font-size:clamp(10px,1vw,14px);font-weight:950;letter-spacing:.24em;text-transform:uppercase;color:#5469b8}.trophy{font-size:clamp(64px,9vw,110px);line-height:1.2;margin:6px auto 8px;filter:drop-shadow(0 12px 12px #dba92b55);animation:float 2.6s ease-in-out infinite}.title{font-size:clamp(30px,5.5vw,68px);line-height:1;letter-spacing:-.05em;margin:10px 0 12px;color:#152c65;font-weight:1000}.school{font-size:clamp(15px,1.7vw,23px);font-weight:800;color:#68758e}.election{font-size:clamp(12px,1.2vw,17px);color:#8791a5;margin-top:5px}.winner{font-size:clamp(28px,5.4vw,66px);font-weight:1000;line-height:1.08;letter-spacing:-.035em;color:#1648a2;margin:25px auto 12px;overflow-wrap:anywhere}.number{display:inline-flex;padding:10px 18px;border-radius:14px;background:#e8efff;color:#244d9e;font-size:clamp(13px,1.5vw,19px);font-weight:950;border:1px solid #d5e1ff}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:1000px;margin:28px auto 18px}.metric{padding:clamp(15px,2vw,26px) 10px;border-radius:20px;background:#fff;border:1px solid #e1e8f5;box-shadow:0 10px 28px #1c376b0c}.metric strong{display:block;font-size:clamp(28px,4vw,48px);line-height:1.1;color:#153f91;font-weight:1000}.metric span{display:block;margin-top:8px;font-size:clamp(9px,1vw,13px);font-weight:950;letter-spacing:.08em;color:#758198}.runner{font-size:clamp(12px,1.3vw,17px);color:#707c92;margin:16px auto;min-height:22px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}.actions button{border:0;border-radius:13px;padding:13px 18px;font-weight:900;font-size:13px;cursor:pointer;background:#eaf0ff;color:#254a96}.actions .primary{background:#164db3;color:#fff;box-shadow:0 8px 20px #164db333}.status{position:fixed;z-index:4;bottom:12px;left:12px;color:#ffffff8c;font-size:10px;letter-spacing:.08em}.waiting{color:#fff;text-align:center;max-width:650px;padding:32px}.waiting .waitIcon{font-size:60px}.waiting h1{font-size:clamp(26px,4vw,44px);margin:12px 0}.waiting p{color:#d1dcf6;font-size:16px}.confetti{position:fixed;top:-20px;left:var(--x);width:9px;height:15px;background:var(--c);z-index:3;pointer-events:none;animation:fall var(--d) linear var(--delay) forwards;transform:rotate(var(--r))}@keyframes appear{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(900deg);opacity:.9}}@media(max-width:650px){.metrics{grid-template-columns:1fr;gap:8px;margin:18px auto}.metric{padding:14px}.metric strong{font-size:30px}.card{border-radius:22px}.trophy{font-size:58px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style>
<link rel="stylesheet" href="/premium-pages.css?v=208"></head>
<body class="premium-resultado"><div class="glow"></div><main class="screen"><div id="waiting" class="waiting"><div class="waitIcon">🗳️</div><h1>Projeção do resultado</h1><p>Aguardando a liberação do resultado pelo painel ADM…</p></div><section id="resultCard" class="card" hidden><div class="eyebrow" id="schoolName">ELEIÇÃO ESCOLAR</div><div class="trophy">🏆</div><h1 class="title" id="headline">A CHAPA VENCEDORA!</h1><div class="school" id="schoolTitle"></div><div class="election" id="electionLabel"></div><div class="winner" id="winnerName"></div><div class="number" id="winnerNumber"></div><div class="metrics"><div class="metric"><strong id="winnerVotes">0</strong><span>VOTOS RECEBIDOS</span></div><div class="metric"><strong id="winnerPercent">0%</strong><span>DOS VOTOS VÁLIDOS</span></div><div class="metric"><strong id="totalVotes">0</strong><span>VOTOS REGISTRADOS</span></div></div><div class="runner" id="runnerUp"></div><div class="actions"><button onclick="makeConfetti()">🎉 MAIS CONFETES</button><button class="primary" onclick="window.location.href='/projecao.html'">↩ VOLTAR À PROJEÇÃO AO VIVO</button></div></section></main><div class="status">RESULTADO OFICIAL • ATUALIZAÇÃO SINCRONIZADA</div>
<script>
const API=window.__HATCHABLE__.api;let lastState='',confettiTimer=null;
function makeConfetti(){document.querySelectorAll('.confetti').forEach(e=>e.remove());const colors=['#ffca3a','#4e80ff','#28c99b','#ff6d9a','#a78bfa','#ff914d','#ffffff'];for(let i=0;i<150;i++){const e=document.createElement('i');e.className='confetti';e.style.setProperty('--x',Math.random()*100+'vw');e.style.setProperty('--c',colors[i%colors.length]);e.style.setProperty('--d',(2.4+Math.random()*3.7)+'s');e.style.setProperty('--delay',(Math.random()*.8)+'s');e.style.setProperty('--r',Math.random()*360+'deg');e.style.setProperty('--drift',((Math.random()-.5)*280)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),7000)}}
function render(d){const list=(d.result_candidates||[]).slice().sort((a,b)=>Number(b.votes||0)-Number(a.votes||0)),t=d.result_totals||{},s=d.settings||{};if(!list.length){document.getElementById('waiting').hidden=false;document.getElementById('resultCard').hidden=true;return}const w=list[0],second=list[1],tie=!!second&&Number(second.votes||0)===Number(w.votes||0),valid=Number(t.valid||0),total=Number(t.total||0),percent=valid?Number(w.votes||0)/valid*100:0;document.documentElement.style.setProperty('--brand',s.primary_color||'#163d8f');document.getElementById('schoolName').textContent=s.school_name||'ELEIÇÃO ESCOLAR';document.getElementById('schoolTitle').textContent=s.election_title||'GRÊMIO ESTUDANTIL';document.getElementById('electionLabel').textContent=s.election_label||'RESULTADO OFICIAL';document.getElementById('headline').textContent=tie?'TEMOS UM EMPATE!':'CONHEÇA A CHAPA VENCEDORA';document.getElementById('winnerName').textContent=tie?'Empate entre chapas':w.name||('Chapa '+w.number);document.getElementById('winnerNumber').textContent=tie?'CHAPAS EMPATADAS':'CHAPA Nº '+(w.number??'—');document.getElementById('winnerVotes').textContent=Number(w.votes||0).toLocaleString('pt-BR');document.getElementById('winnerPercent').textContent=percent.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';document.getElementById('totalVotes').textContent=total.toLocaleString('pt-BR');document.getElementById('runnerUp').textContent=tie?'A apuração terminou empatada. Confira as regras eleitorais da escola para os próximos passos.':second?'Na sequência: '+(second.name||('Chapa '+second.number))+' • '+Number(second.votes||0).toLocaleString('pt-BR')+' voto(s).':'';document.getElementById('waiting').hidden=true;document.getElementById('resultCard').hidden=false;if(lastState!==String(w.id)+':'+String(w.votes)+':'+String(t.total)+':'+String(tie)){lastState=String(w.id)+':'+String(w.votes)+':'+String(t.total)+':'+String(tie);makeConfetti()}}
async function load(){try{const r=await fetch(API+'/projection',{cache:'no-store'});if(!r.ok)return;const d=await r.json();if(d.results_revealed)render(d);else{document.getElementById('waiting').hidden=false;document.getElementById('resultCard').hidden=true;lastState=''}}catch(e){console.error('Não foi possível atualizar a projeção do resultado',e)}}load();setInterval(load,2500);document.addEventListener('keydown',e=>{if(e.key==='Escape')window.location.href='/projecao.html'});
</script></body></html>
